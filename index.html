    <script>
      (function () {
        var stored;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {
          stored = null;
        }
        if (stored !== "dark" && stored !== "light") {
          stored = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.setAttribute("data-theme", stored);
      })();
    </script>
